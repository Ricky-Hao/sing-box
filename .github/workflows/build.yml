name: Build validated patchset

on:
  workflow_call:
    inputs:
      maintenance: {required: true, type: string}
      application-commit: {required: true, type: string}
      application-tree: {required: true, type: string}
      version: {required: true, type: string}
      tag: {required: true, type: string}
    secrets:
      SFA_RELEASE_KEYSTORE: {required: true}
      SFA_KEYSTORE_PASS: {required: true}
      SFA_KEY_ALIAS: {required: true}
      SFA_KEY_PASS: {required: true}

permissions:
  contents: read

env:
  MAINTENANCE_SHA: ${{ inputs.maintenance }}
  APPLICATION_COMMIT: ${{ inputs.application-commit }}
  APPLICATION_TREE: ${{ inputs.application-tree }}
  VERSION: ${{ inputs.version }}
  RELEASE_TAG: ${{ inputs.tag }}
  GOWORK: 'off'

defaults:
  run:
    working-directory: .work/application

jobs:
  build:
    name: Build binary
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, variant: purego, naive: true}
          - {os: linux, arch: amd64, variant: musl, naive: true}
          - {os: linux, arch: arm64, variant: purego, naive: true}
          - {os: linux, arch: arm64, variant: musl, naive: true}
          - {os: freebsd, arch: amd64}
          - {os: freebsd, arch: arm64}
    steps:
      - name: Checkout exact maintenance version
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.maintenance }}
          persist-credentials: false
      - name: Rebuild validated snapshot
        working-directory: .
        run: python3 tools/ci.py --maintenance "$MAINTENANCE_SHA" --expect-commit "$APPLICATION_COMMIT" --expect-tree "$APPLICATION_TREE"
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.10
          cache-dependency-path: .work/application/go.sum
      - name: Clone cronet-go
        if: matrix.naive && matrix.variant == 'musl'
        run: |
          set -euo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go sparse-checkout set --no-cone '/*' '!/lib'
          git -C ~/cronet-go fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1
      - name: Regenerate Debian keyring
        if: matrix.naive && matrix.variant == 'musl'
        run: |
          set -euo pipefail
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
      - name: Download Chromium toolchain
        if: matrix.naive && matrix.variant == 'musl'
        run: |
          set -euo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain
      - name: Set Chromium toolchain environment
        if: matrix.naive && matrix.variant == 'musl'
        run: |
          set -euo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env >> "$GITHUB_ENV"
      - name: Set build tags
        run: |
          set -euo pipefail
          if [[ "${{ matrix.naive }}" == "true" ]]; then
            TAGS=$(cat release/DEFAULT_BUILD_TAGS)
          else
            TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)
          fi
          if [[ "${{ matrix.os }}" == "freebsd" ]]; then
            TAGS=$(echo "$TAGS" | sed -e 's/,with_tailscale//g' -e 's/with_tailscale,//g' -e 's/with_tailscale//g')
          fi
          if [[ "${{ matrix.variant }}" == "purego" ]]; then
            TAGS="${TAGS},with_purego"
          elif [[ "${{ matrix.variant }}" == "musl" ]]; then
            TAGS="${TAGS},with_musl"
          fi
          echo "BUILD_TAGS=${TAGS}" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"
      - name: Build (purego)
        if: matrix.variant == 'purego'
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" ./cmd/sing-box
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
      - name: Extract libcronet.so
        if: matrix.variant == 'purego' && matrix.naive
        run: |
          set -euo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          LIBRARY_PATH="lib/${{ matrix.os }}_${{ matrix.arch }}/libcronet.so"
          git init "$RUNNER_TEMP/cronet-go-lib"
          git -C "$RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "$RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/$LIBRARY_PATH"
          git -C "$RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C "$RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
          cp "$RUNNER_TEMP/cronet-go-lib/$LIBRARY_PATH" dist/
      - name: Build (musl)
        if: matrix.variant == 'musl'
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" ./cmd/sing-box
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
      - name: Build (FreeBSD)
        if: matrix.os == 'freebsd'
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" ./cmd/sing-box
        env:
          CGO_ENABLED: '0'
          GOOS: freebsd
          GOARCH: ${{ matrix.arch }}
      - name: Set name
        run: |
          DIR_NAME="sing-box-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          if [[ "${{ matrix.variant }}" == "musl" ]]; then DIR_NAME="${DIR_NAME}-musl"; fi
          echo "DIR_NAME=${DIR_NAME}" >> "$GITHUB_ENV"
      - name: Archive
        run: |
          set -euo pipefail
          cd dist
          mkdir "${DIR_NAME}"
          cp ../LICENSE sing-box "${DIR_NAME}"
          if [ -f libcronet.so ]; then cp libcronet.so "${DIR_NAME}"; fi
          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -r "${DIR_NAME}"
      - name: Cleanup
        run: rm -f dist/sing-box dist/libcronet.so
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.os }}_${{ matrix.arch }}${{ matrix.variant && format('-{0}', matrix.variant) }}
          path: .work/application/dist

  build_darwin:
    name: Build Darwin binaries
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.maintenance }}
          persist-credentials: false
      - name: Rebuild validated snapshot
        working-directory: .
        run: python3 tools/ci.py --maintenance "$MAINTENANCE_SHA" --expect-commit "$APPLICATION_COMMIT" --expect-tree "$APPLICATION_TREE"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.10
          cache-dependency-path: .work/application/go.sum
      - name: Set build tags and shared ldflags
        run: |
          echo "BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS)" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" ./cmd/sing-box
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
      - name: Archive
        run: |
          set -euo pipefail
          DIR_NAME="sing-box-${VERSION}-darwin-${{ matrix.arch }}"
          cd dist
          mkdir "${DIR_NAME}"
          cp ../LICENSE sing-box "${DIR_NAME}"
          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -r "${DIR_NAME}"
      - name: Cleanup
        run: rm dist/sing-box
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-darwin_${{ matrix.arch }}
          path: .work/application/dist

  build_windows:
    name: Build Windows binaries
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.maintenance }}
          persist-credentials: false
      - name: Rebuild validated snapshot
        working-directory: .
        shell: bash
        run: python3 tools/ci.py --maintenance "$MAINTENANCE_SHA" --expect-commit "$APPLICATION_COMMIT" --expect-tree "$APPLICATION_TREE"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.10
          cache-dependency-path: .work/application/go.sum
      - name: Patch Go for Windows ARM64
        if: matrix.arch == 'arm64'
        shell: bash
        run: .github/patch_go_for_windows_arm64.sh
      - name: Build
        run: |
          $TAGS = Get-Content release/DEFAULT_BUILD_TAGS_WINDOWS
          $LDFLAGS_SHARED = Get-Content release/LDFLAGS
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box.exe -tags "$TAGS" `
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=$env:VERSION' $LDFLAGS_SHARED -s -w -buildid=" ./cmd/sing-box
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
      - name: Extract libcronet.dll
        run: |
          $CRONET_GO_VERSION = Get-Content .github/CRONET_GO_VERSION
          $LIBRARY_PATH = "lib/windows_${{ matrix.arch }}/libcronet.dll"
          git init "$env:RUNNER_TEMP/cronet-go-lib"
          git -C "$env:RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "$env:RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/$LIBRARY_PATH"
          git -C "$env:RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C "$env:RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
          Copy-Item "$env:RUNNER_TEMP/cronet-go-lib/$LIBRARY_PATH" dist
      - name: Archive
        run: |
          $DIR_NAME = "sing-box-$env:VERSION-windows-${{ matrix.arch }}"
          mkdir "dist/$DIR_NAME"
          Copy-Item LICENSE, dist/sing-box.exe, dist/libcronet.dll "dist/$DIR_NAME"
          Compress-Archive -Path "dist/$DIR_NAME" -DestinationPath "dist/$DIR_NAME.zip"
          Remove-Item -Recurse "dist/$DIR_NAME"
      - name: Cleanup
        run: Remove-Item dist/sing-box.exe, dist/libcronet.dll
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-windows_${{ matrix.arch }}
          path: .work/application/dist

  build_android_library:
    name: Build Android library (arm64)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.maintenance }}
          persist-credentials: false
      - name: Rebuild validated snapshot
        working-directory: .
        run: python3 tools/ci.py --maintenance "$MAINTENANCE_SHA" --expect-commit "$APPLICATION_COMMIT" --expect-tree "$APPLICATION_TREE"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.10
          cache-dependency-path: .work/application/go.sum
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r28
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Build library and verify iWAN inclusion
        run: |
          set -euo pipefail
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/arm64 2>&1 | tee "$RUNNER_TEMP/libbox-build.log"
          grep -Fq 'github.com/sagernet/sing-box/transport/iwan' "$RUNNER_TEMP/libbox-build.log"
          grep -Fq 'github.com/sagernet/sing-box/protocol/iwan' "$RUNNER_TEMP/libbox-build.log"
          mkdir -p dist/arm64
          mv libbox.aar libbox-legacy.aar dist/arm64
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libbox-android-arm64
          path: .work/application/dist
          compression-level: 0

  build_android:
    name: Build Android (other, arm64-v8a)
    needs: build_android_library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.maintenance }}
          persist-credentials: false
      - name: Rebuild validated snapshot
        working-directory: .
        run: python3 tools/ci.py --maintenance "$MAINTENANCE_SHA" --expect-commit "$APPLICATION_COMMIT" --expect-tree "$APPLICATION_TREE"
      - name: Checkout pinned Android client
        run: git submodule update --init --recursive clients/android
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.10
          cache-dependency-path: .work/application/go.sum
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r28
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Download libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libbox-android-arm64
          path: .work/application/libbox-inputs
      - name: Merge libraries
        run: |
          go run ./cmd/internal/merge_aar -output libbox.aar libbox-inputs/*/libbox.aar
          go run ./cmd/internal/merge_aar -output libbox-legacy.aar libbox-inputs/*/libbox-legacy.aar
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
      - name: Update snapshot version
        run: go run -v ./cmd/internal/update_android_version --ci --nightly
      - name: Build with stable release signing
        run: |
          set -euo pipefail
          mkdir -p clients/android/app/libs
          cp *.aar clients/android/app/libs
          cd clients/android
          if [ -z "${SFA_RELEASE_KEYSTORE:-}" ] || [ -z "${SFA_KEYSTORE_PASS:-}" ] || [ -z "${SFA_KEY_ALIAS:-}" ] || [ -z "${SFA_KEY_PASS:-}" ]; then
            echo '::error::Set all four stable SFA signing secrets before release.'
            exit 1
          fi
          umask 077
          printf '%s' "$SFA_RELEASE_KEYSTORE" | base64 --decode > app/release.keystore
          {
            printf 'KEYSTORE_PASS=%s\n' "$SFA_KEYSTORE_PASS"
            printf 'ALIAS_NAME=%s\n' "$SFA_KEY_ALIAS"
            printf 'ALIAS_PASS=%s\n' "$SFA_KEY_PASS"
          } > local.properties
          perl -0pi -e 's/isUniversalApk = true/isUniversalApk = false/' app/build.gradle.kts
          perl -0pi -e 's/include\("armeabi-v7a", "arm64-v8a", "x86", "x86_64"\)/include("arm64-v8a")/' app/build.gradle.kts
          grep -q 'include("arm64-v8a")' app/build.gradle.kts
          ./gradlew --build-cache --parallel :app:assembleOtherRelease
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          SFA_RELEASE_KEYSTORE: ${{ secrets.SFA_RELEASE_KEYSTORE }}
          SFA_KEYSTORE_PASS: ${{ secrets.SFA_KEYSTORE_PASS }}
          SFA_KEY_ALIAS: ${{ secrets.SFA_KEY_ALIAS }}
          SFA_KEY_PASS: ${{ secrets.SFA_KEY_PASS }}
      - name: Remove signing files
        if: always()
        run: rm -f clients/android/app/release.keystore clients/android/local.properties
      - name: Prepare upload
        run: |
          set -euo pipefail
          mkdir -p dist
          cp clients/android/app/build/outputs/apk/other/release/*arm64-v8a*.apk dist
          VERSION_CODE=$(grep VERSION_CODE clients/android/version.properties | cut -d= -f2)
          VERSION_NAME=$(grep VERSION_NAME clients/android/version.properties | cut -d= -f2)
          export VERSION_CODE VERSION_NAME
          python3 -c 'import json, os; from pathlib import Path; Path("dist/SFA-version-metadata.json").write_text(json.dumps({"version_code":int(os.environ["VERSION_CODE"]), "version_name":os.environ["VERSION_NAME"]}, indent=2)+"\n")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-android-apks-other
          path: .work/application/dist

  publish:
    name: Publish exact validated assets
    needs: [build, build_darwin, build_windows, build_android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.maintenance }}
          persist-credentials: false
      - name: Rebuild validated snapshot
        id: source
        run: python3 tools/ci.py --maintenance "$MAINTENANCE_SHA" --expect-commit "$APPLICATION_COMMIT" --expect-tree "$APPLICATION_TREE"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: .work/assets
      - name: Verify exact release policy
        run: python3 tools/check_assets.py .work/assets --version "$VERSION" > .work/expected-assets.txt
      - name: Write release notes
        env:
          BASE: ${{ steps.source.outputs.base }}
          APPLICATION_BRANCH: ${{ steps.source.outputs.branch }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          fields = [('Maintenance', 'MAINTENANCE_SHA'), ('Upstream base', 'BASE'), ('Application branch', 'APPLICATION_BRANCH'), ('Application commit', 'APPLICATION_COMMIT'), ('Application tree', 'APPLICATION_TREE')]
          notes = '\n'.join(f'{label}: `{os.environ[key]}`' for label, key in fields)
          notes += '\n\nRebuild: check out the exact maintenance SHA, then run `python3 tools/patchset.py branch --target .work/application`.\n'
          notes += '\nThe release tag identifies the maintenance source. Official upstream tags are preserved.\n'
          Path('.work/release-notes.md').write_text(notes)
          PY
      - name: Create a new release without overwriting tags or assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "patchset-v$VERSION"
          # Ref creation is atomic and rejects an existing tag, including races.
          gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$MAINTENANCE_SHA" > /dev/null
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "sing-box $VERSION" --notes-file .work/release-notes.md .work/assets/*
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort > .work/published-assets.txt
          diff -u .work/expected-assets.txt .work/published-assets.txt
          gh release edit "$RELEASE_TAG" --draft=false
