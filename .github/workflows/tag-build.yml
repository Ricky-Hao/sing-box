name: Tag build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
          - name: linux-arm64
            goos: linux
            goarch: arm64
          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
          - name: freebsd-amd64
            goos: freebsd
            goarch: amd64
          - name: freebsd-arm64
            goos: freebsd
            goarch: arm64
          - name: windows-amd64
            goos: windows
            goarch: amd64
            extension: ".exe"
          - name: windows-arm64
            goos: windows
            goarch: arm64
            extension: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare build variables
        shell: bash
        run: |-
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "${GITHUB_ENV}"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            echo "BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS_WINDOWS)" >> "${GITHUB_ENV}"
          else
            # Use the non-Naive default tags for simple cross-compiled CLI archives.
            tags="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
            if [[ "${{ matrix.goos }}" == "freebsd" ]]; then
              tags="${tags/,with_tailscale/}"
            fi
            echo "BUILD_TAGS=${tags}" >> "${GITHUB_ENV}"
          fi

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          set -euo pipefail
          dir="sing-box-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/${dir}"
          go build -v -trimpath \
            -o "dist/${dir}/sing-box${{ matrix.extension }}" \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${VERSION} ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box
          cp LICENSE "dist/${dir}/"

      - name: Archive
        shell: bash
        run: |-
          set -euo pipefail
          cd dist
          dir="sing-box-${VERSION}-${{ matrix.name }}"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            zip -9 -r "${dir}.zip" "${dir}"
          else
            tar -czf "${dir}.tar.gz" "${dir}"
          fi
          rm -r "${dir}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
